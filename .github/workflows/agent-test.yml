name: Test AI Agent

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate syntax
        run: python -m compileall orchestrator.py agents smoke_test.py

      - name: Validate API key is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'EOF'
          import os, sys
          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              print("ERROR: OPENAI_API_KEY secret is not set or is empty.", file=sys.stderr)
              sys.exit(1)
          print("API key is present.")
          EOF

      - name: Run smoke tests
        run: python smoke_test.py
